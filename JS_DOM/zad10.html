<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Promjena slike</title>
  </head>
  <body>
    <img
      id="slika"
      src="https://placehold.co/300x200/87CEEB/890900?text=Prva+slika"
      alt="Prva slika"
      width="300"
    />

    <br /><br />

    <button id="gumb">Promijeni sliku</button>

    <script>
      let gumb = document.querySelector("#gumb");
      let slika = document.querySelector("#slika");

      gumb.addEventListener("click", function () {
        slika.src =
          "https://placehold.co/300x200/90EE90/000000?text=Druga+slika";
        slika.alt = "Druga slika sa zelenom pozadinom";
      });
    </script>
  </body>
</html>
