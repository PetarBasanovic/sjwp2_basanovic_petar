<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>promjena vise elemenata</title>
  </head>
  <body>
    <p>Ovo je prvi odlomak.</p>
    <p>Ovo je drugi odlomak.</p>
    <p>Ovo je treći odlomak.</p>

    <script>
      let odlomci = document.querySelectorAll("p");

      odlomci[0].style.color = "red";
      odlomci[1].style.color = "blue";
      odlomci[2].style.color = "green";
    </script>
  </body>
</html>
